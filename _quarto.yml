project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - seances/*.qmd
    - cours/*.qmd
    - cours/*.md
    - methode.qmd
  pre-render: R/date_maj.R
  # icônes de repli, déclarées par filters/icones.lua
  resources:
    - icones/favicon-32.png
    - icones/apple-touch-icon.png

lang: fr

website:
  title: "Carnet de bord"
  description: "Carnet de bord du laboratoire d'agent d'études statistiques : séances, planning, cours et méthode."
  site-url: "https://maryleneh.github.io/carnet-de-bord/"
  search: false
  # une page de carnet cornée, avec une estimation et son intervalle de confiance
  favicon: icones/favicon.svg
  page-navigation: true
  # Barre latérale du cours : le plan (cours/index.qmd) en tête, puis chaque
  # chapitre du dossier cours/, ajouté seul dès que son fichier existe.
  sidebar:
    - id: cours
      title: "Cours"
      contents:
        - auto: "cours"
  navbar:
    left:
      - text: Tableau de bord
        href: index.qmd
      - text: Séances
        href: seances/index.qmd
      - text: Cours
        href: cours/index.qmd
      - text: Méthode
        href: methode.qmd
  page-footer:
    left: "Mis à jour le {{< var maj >}}"
    right:
      - text: "Dépôt du carnet sur GitHub"
        href: "https://github.com/MaryleneH/carnet-de-bord"

format:
  html:
    theme: [default, styles/carnet.scss]
    highlight-style: a11y
    grid:
      body-width: 680px
    anchor-sections: false
    link-external-icon: false
    smooth-scroll: false

execute:
  echo: false
  warning: false
  message: false

filters:
  # avant l'analyse de Quarto, pour que les encadrés deviennent des callouts
  - path: filters/cours.lua
    at: pre-ast
  - filters/tableaux.lua
  - filters/typo-fr.lua
  - filters/icones.lua
