name: Publish Quarto to GitHub Pages

# Déploiement avec la source « GitHub Actions » de GitHub Pages : le site rendu
# est envoyé comme artefact puis publié par actions/deploy-pages.
# Aucune branche gh-pages : rien n'est commité ni poussé dans le dépôt.
# Prérequis (une seule fois) : Settings → Pages → Build and deployment
# → Source : « GitHub Actions ».

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lecture seule par défaut ; seul le job deploy reçoit des droits en plus.
permissions:
  contents: read

# Un seul déploiement Pages à la fois. Un déploiement en cours n'est jamais
# interrompu : le run suivant attend son tour.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Le workflow ne pousse plus rien : inutile de garder le jeton dans .git/config.
          persist-credentials: false

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2

      - name: Validate data and run tests
        run: |
          Rscript -e 'source("R/valider.R"); valider_tout("data"); testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.39

      - name: Render Quarto site
        uses: quarto-dev/quarto-actions/render@v2

      # Pas d'actions/configure-pages : Quarto produit des liens relatifs et n'a
      # pas besoin des métadonnées qu'elle fournit.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Un bloc permissions au niveau du job remplace celui du workflow.
    permissions:
      contents: read
      pages: write     # créer le déploiement GitHub Pages
      id-token: write  # jeton OIDC prouvant que le déploiement vient de ce workflow

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
