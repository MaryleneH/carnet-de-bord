# Veille : les liens que je garde, rangés par thème.
#
# Règles vérifiées par R/valider.R :
#   - un thème a un identifiant unique et un titre ; sa couleur, facultative,
#     vient de la palette du cours (bleu, orange, vert, violet, gris) ;
#   - un lien a une adresse https publique et unique, un titre, un thème
#     connu, une date d'ajout, un type autorisé, une langue (fr ou en) et un
#     résumé ; « pourquoi » et les mots-clés sont facultatifs ;
#   - l'adresse est celle d'origine : ni redirection (lien copié depuis une
#     messagerie), ni lien raccourci, ni paramètre de suivi (utm_…) ;
#   - confidentialité : aucun texte ne mentionne d'autre projet.
#
# Les thèmes s'affichent dans cet ordre ; un thème sans lien n'apparaît pas.
# Dans un thème, les liens les plus récents viennent en premier.

themes:
  - id: protocoles-agents
    titre: Protocoles d'agents
    couleur: bleu
    description: >-
      Comment un agent parle à ses outils, aux autres agents et à
      l'utilisateur : MCP, A2A, A2UI.

  - id: contexte-agents
    titre: Contexte et mémoire
    couleur: vert
    description: >-
      Ce qu'un agent garde sous les yeux, et sous quelle forme : sorties
      d'outils, compression du contexte, mémoire.

  - id: agents-de-codage
    titre: Agents de codage
    couleur: orange
    description: >-
      Ce qui change quand un agent écrit le code : le rôle des développeurs,
      la revue de code, et des outils à repenser pour les agents (gestion de
      versions, intégration continue, composants d'interface).

  - id: interpretabilite
    titre: Interprétabilité
    couleur: violet
    description: >-
      Ouvrir les modèles : lire ce que font leurs poids, et parfois les
      modifier directement.

  - id: methodes-statistiques
    titre: Méthodes statistiques
    couleur: gris
    description: >-
      Les méthodes du statisticien, revisitées par les outils de
      l'apprentissage moderne : classification, optimisation, inférence.

liens:
  - url: https://a2ui.org/quickstart/step-by-step/
    titre: "A2UI : démarrage pas à pas"
    theme: protocoles-agents
    type: tutoriel
    langue: en
    ajoute_le: 2026-11-11
    resume: >-
      Le guide pas à pas pour faire tourner la démo d'A2UI, le protocole
      ouvert de Google qui permet à un agent de décrire une interface
      (formulaire, carte, boutons) que l'application affiche avec ses propres
      composants. On clone le dépôt, on fournit une clé d'API Gemini, on lance
      l'agent d'exemple en Python et le client web, puis on demande
      « Book a table for 2 » pour voir apparaître un formulaire de réservation.
    pourquoi: >-
      MCP relie un agent à ses outils, A2A relie les agents entre eux, et A2UI
      complète le tableau du côté de l'utilisateur. L'agent n'envoie jamais de
      code, seulement une description déclarative en JSON : c'est
      l'application qui garde la main sur ce qu'elle affiche.
    mots_cles: [A2UI, interfaces génératives, Gemini, agents]

  - url: https://arxiv.org/abs/2611.06500
    titre: "Les outils n'ont pas à parler en texte : compression latente du contexte des agents"
    theme: contexte-agents
    type: article scientifique
    langue: en
    ajoute_le: 2026-11-12
    resume: >-
      Les sorties d'outils, longues et bruitées, encombrent le contexte d'un
      agent et dispersent son attention. Une équipe de l'université Tsinghua
      propose Coca-Cola, un modèle qui compresse chaque sortie d'outil en
      tokens latents : des vecteurs continus, placés directement dans
      l'espace des plongements (embeddings) d'entrée de l'agent, qui reste
      figé. L'entraînement aligne la prochaine action de l'agent, qu'il lise
      la sortie complète ou sa version compressée. Avec des agents de
      recherche web, sur quatre jeux de questions-réponses et deux familles
      de modèles, les auteurs annoncent 70 à 89 % de tokens en moins, un
      temps d'exécution réduit de 24 à 56 % et de meilleures réponses.
    pourquoi: >-
      L'idée bouscule une évidence : un agent n'est pas obligé de lire ses
      outils en texte. On retrouve le principe des modèles multimodaux, où
      une image entre dans le modèle sous forme de vecteurs produits par un
      encodeur, et non sous forme de mots. Le critère d'entraînement est à
      retenir : une bonne compression est celle qui ne change pas la décision
      de l'agent. Limite : il faut pouvoir injecter des vecteurs à l'entrée
      du modèle, donc avoir la main sur un modèle ouvert ; une API qui
      n'accepte que du texte ne le permet pas.
    mots_cles: [compression du contexte, tokens latents, embeddings, sorties d'outils, Coca-Cola]

  - url: https://www.anthropic.com/research/redesigning-source-control
    titre: "Repenser la gestion de versions quand les agents écrivent le code"
    theme: agents-de-codage
    type: article
    langue: en
    ajoute_le: 2026-11-12
    resume: >-
      Le code écrit par Claude a fait de la gestion de versions le principal
      goulot d'étranglement d'Anthropic : environ 2 500 changements fusionnés
      par jour en mai 2026, plus de 30 000 en septembre. En cinq mois, une
      équipe de sept personnes a construit Scion, un système pensé pour des
      clients toujours en ligne (agents, tâches automatisées), et y a migré
      son monorepo, le dépôt unique de tout son code, depuis git. Le serveur
      calcule l'historique, les diffs et les fusions ; le client ne récupère
      que les fichiers qu'il lit. Scion reste propre à Anthropic : l'article
      en partage les principes, pour que les serveurs git s'en inspirent.
    pourquoi: >-
      Un retour d'expérience rare sur ce qui casse quand des agents écrivent
      l'essentiel du code : l'écriture n'est plus le facteur limitant,
      l'outillage pensé pour des humains le devient. Je retiens surtout le
      rôle des ingénieurs : dire souvent « non » à Claude quand il enfreint
      une contrainte du système, relire l'intention d'un changement plutôt
      que chaque ligne, et confier à un Claude dédié la surveillance de
      chaque composant.
    mots_cles: [gestion de versions, git, monorepo, intégration continue, Claude]

  - url: https://rikiyat.github.io/blog/weight-space-programming/
    titre: "Weight-Space Programming : un LLM lit et modifie directement les poids d'un réseau"
    theme: interpretabilite
    type: article
    langue: en
    ajoute_le: 2026-11-12
    resume: >-
      Des chercheurs, dont Omar Khattab, le créateur de DSPy, confient à un
      modèle de pointe les poids bruts d'un autre réseau, une session Python
      et un objectif en langage naturel, sans entraînement ni descente de
      gradient. En lecture, sans jamais exécuter de petits transformeurs
      entraînés au niveau des caractères, le modèle reconnaît la langue de
      leurs données et y repère les têtes d'induction, celles qui prolongent
      une séquence déjà vue en la recopiant. En écriture, il modifie 0,016 %
      des poids de Qwen3.5-0.8B, supprime ses boucles de raisonnement et
      multiplie jusqu'à six fois son score en mathématiques, selon les
      auteurs. La méthode réussit sur des défauts localisés, pas sur des
      comportements diffus comme la complaisance. Billet de recherche, non
      relu par des pairs.
    pourquoi: >-
      À tester, pour comprendre un transformeur de l'intérieur : l'expérience
      de lecture se refait à petite échelle, sur un mini-modèle entraîné
      soi-même. Pour un assistant qui rédige des études, l'apport direct est
      faible : il faut détenir les poids du modèle, et l'essentiel se joue
      ailleurs (sources, calculs, rédaction). Le lien utile passe par DSPy,
      créé par l'un des auteurs, qui sert à programmer un assistant plutôt
      qu'à écrire ses prompts à la main.
    mots_cles: [weight-space programming, têtes d'induction, édition de modèles, DSPy, Qwen]

  - url: https://github.com/meta/astryx
    titre: "Astryx : le design system de Meta, conçu pour les humains et les agents"
    theme: agents-de-codage
    type: dépôt
    langue: en
    ajoute_le: 2026-11-12
    resume: >-
      Le design system open source de Meta, développé chez Meta depuis huit
      ans et utilisé par plus de 13 000 applications : plus de 150 composants
      React accessibles, des thèmes, un mode sombre, des modèles de pages et
      un outil en ligne de commande. Sa particularité : la documentation,
      l'API et cet outil sont conçus ensemble pour qu'un développeur et un
      agent de code construisent de la même façon. L'outil sert la
      documentation des composants, y compris en JSON typé, et un plugin
      l'apporte à Claude Code et à Codex. En bêta, sous licence MIT.
    pourquoi: >-
      Une idée transférable bien au-delà des interfaces : écrire la
      documentation d'un outil pour qu'un agent s'en serve aussi bien qu'un
      humain, puis le vérifier. Meta le mesure avec des « vibe tests » : les
      mêmes prompts, donnés à des LLM avec différents design systems, et des
      résultats comparés. Côté graphiques, le module fondé sur Vega-Lite
      n'est encore qu'en préversion.
    mots_cles: [design system, React, composants, CLI, vibe tests, Meta]

  - url: https://e-means.github.io
    titre: "e-means : un k-means dix fois plus rapide, à perte égale"
    theme: methodes-statistiques
    type: article
    langue: en
    ajoute_le: 2026-11-12
    resume: >-
      Des chercheurs de Meta FAIR, dont plusieurs auteurs de la bibliothèque
      Faiss, modernisent le k-means. Au lieu de recalculer chaque centroïde
      sur toutes les données à chaque passe, comme l'algorithme de Lloyd,
      e-means travaille par mini-lots et met à jour la somme et l'effectif de
      chaque classe par moyenne mobile exponentielle : Lloyd en devient un
      cas particulier. La taille des lots et le pas sont fixés par des lois
      d'échelle, sans réglage. Selon les auteurs, la perte que Lloyd atteint
      en 25 passes est atteinte en 1,2 à 3 passes, soit 10 à 45 fois plus
      vite sur GPU et 8 à 15 fois sur CPU, avec moins de blocages dans de
      mauvais minima locaux. Le code est dans Faiss.
    pourquoi: >-
      Le k-means est dans la boîte à outils de tout statisticien, et il sert
      aussi à indexer les embeddings d'un RAG : les index IVF de Faiss
      partitionnent les vecteurs par k-means. Le billet est une belle leçon
      d'optimisation, où les idées de l'apprentissage profond (mini-lots,
      moyenne mobile, pas qui décroît en cosinus, lois d'échelle) rajeunissent
      un algorithme de 1957. À tester : un carnet Colab tourne sur CPU, et
      une démo se manipule dans le navigateur.
    mots_cles: [k-means, classification, Faiss, moyenne mobile exponentielle, lois d'échelle, embeddings]
